name: Desktop packages with Bluetooth
on:
  workflow_dispatch:
    inputs:
      stage_release_tag:
        description: 'Optional existing release tag; published releases require explicit replacement'
        required: false
        default: ''
      skip_tests:
        description: 'Skip test suites and Bluetooth self-tests for this build'
        type: boolean
        default: false
      replace_published_release:
        description: 'Replace packages in the existing published release without changing its version'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac
            arch: arm64
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-22.04
            target: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - if: ${{ !inputs.skip_tests }}
        run: npm test
      - if: ${{ !inputs.skip_tests }}
        run: python -m unittest discover -s test -p 'bluetooth_*.py'
      - run: python -m venv .venv-bluetooth
      - if: runner.os != 'Windows'
        run: .venv-bluetooth/bin/python3 -m pip install -r bluetooth/requirements.txt
      - if: runner.os == 'Windows'
        run: .venv-bluetooth/Scripts/python.exe -m pip install -r bluetooth/requirements.txt
      - run: npm run build:bluetooth
        env:
          ATOMIC_SKIP_TESTS: ${{ inputs.skip_tests && '1' || '' }}
      - run: npx electron-builder --${{ matrix.target }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/verify-built-package.cjs ${{ matrix.target }} ${{ matrix.arch }}
        env:
          ATOMIC_SKIP_TESTS: ${{ inputs.skip_tests && '1' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: AtomicClockSync-${{ matrix.target }}
          if-no-files-found: error
          path: |
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
  stage-release:
    if: inputs.stage_release_tag != ''
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: AtomicClockSync-*
          merge-multiple: true
          path: release
      - run: python3 scripts/release-checksums.py --github
      - run: python3 scripts/stage-release.py
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.stage_release_tag }}
          REPLACE_PUBLISHED_RELEASE: ${{ inputs.replace_published_release && '1' || '' }}
